<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Premium v9.1.1</title>

    <style>
        :root {
            --bg-dark: #010a01; 
            --card-base: rgba(0, 20, 0, 0.8);
            --matrix-green: #00ff41;
            --matrix-glow: rgba(0, 255, 65, 0.4);
            --matrix-yellow: #ffd700;
            --matrix-soft: #80ff9c;
            --btn-dark: #001a00;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            margin: 0; padding: 12px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        #header { text-align: center; margin-bottom: 20px; }
        #header h1 { 
            color: var(--matrix-green); 
            letter-spacing: 10px; 
            margin: 0; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 2rem;
            text-shadow: 0 0 15px var(--matrix-glow);
        }
        .edition-tag { 
            color: var(--matrix-yellow); 
            font-size: 0.8rem; 
            font-weight: bold; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 4px;
        }
        .version-tag { color: var(--matrix-soft); font-size: 0.65rem; font-weight: bold; }

        #categories {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 6px; margin-bottom: 15px;
        }

        /* Standard Button-Stil für oben */
        .cat-btn {
            padding: 10px 2px; font-size: 0.7rem; font-weight: bold;
            background: var(--btn-dark); color: var(--matrix-green);
            border: 1px solid rgba(0, 255, 0, 0.2); border-radius: 6px;
            cursor: pointer; text-transform: uppercase;
        }

        #card {
            flex: 1;
            background: var(--card-base);
            border: 1px solid var(--matrix-green);
            border-radius: 30px;
            padding: 35px 25px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
            margin-bottom: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .top-meta {
            position: absolute; top: 18px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 0.65rem; color: var(--matrix-green);
            text-transform: uppercase; letter-spacing: 2px;
            opacity: 0.7;
        }

        .title { font-size: 1.8rem; font-weight: bold; color: #fff; margin-bottom: 16px; }
        
        .content { 
            font-size: 1.35rem; line-height: 1.5; font-weight: 700; 
            color: #ffffff; width: 100%; font-style: normal;
        }

        .quiz-row { display: flex; gap: 10px; width: 100%; margin-top: 20px; }
        
        /* Quiz-Buttons angepasst */
        .quiz-action-btn {
            flex: 1; padding: 18px; 
            background: var(--btn-dark); color: var(--matrix-green); 
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 12px; font-weight: bold; text-transform: uppercase;
        }

        .feedback-btn {
            width: 100%; margin-top: 20px; padding: 15px;
            background: var(--matrix-green); color: black;
            border: none; border-radius: 12px; font-weight: bold;
        }

        .card-index {
            position: absolute; bottom: 13px;
            font-size: 0.75rem; color: rgba(0, 255, 65, 0.4);
            font-weight: bold; letter-spacing: 3px;
        }

        /* Nav-Buttons UNTEN angepasst an Stil OBEN */
        .nav-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .nav-btn {
            flex: 1; padding: 10px; 
            background: var(--btn-dark); color: #fff; 
            border: 1px solid rgba(0, 255, 0, 0.2); /* Gleiche Umrandung */
            border-radius: 6px; /* Gleicher Radius wie oben */
            font-weight: bold; text-transform: uppercase; font-size: 0.75rem;
            cursor: pointer;
        }

        /* Philosophie-Button angepasst */
        .phi-btn {
            width: 100%; padding: 12px; 
            background: var(--btn-dark); color: var(--matrix-yellow); 
            border: 1px solid rgba(0, 255, 0, 0.2); /* Gleiche Umrandung */
            border-radius: 6px; /* Gleicher Radius wie oben */
            font-weight: bold; text-transform: uppercase;
            margin-bottom: 8px; font-size: 0.75rem;
            cursor: pointer;
        }

        #footer { text-align: center; font-size: 0.65rem; color: var(--matrix-soft); padding: 5px 0; font-weight: bold; }
    </style>
</head>

        <button class="cat-btn" onclick="setCat('ausblick')">Ausblick</button>

    <div id="card" onclick="cardClick()">

            <span id="meta-cat">Archiv</span>

        <button class="nav-btn" onclick="speak(event)">🔊 Vorlesen</button>

                {t:"Comics", i:"Print", c:"Zahlreiche Kurzgeschichten vertiefen das Universum."},
                {t:"VR-Erlebnis", i:"Technik", c:"Matrix Awakens zeigt die Power der Unreal Engine 5."},
                {t:"Mode-Revival", i:"Style", c:"Der 'Matrix-Look' kehrt regelmäßig auf Laufstege zurück."},
                {t:"Philosophie-Bücher", i:"Bildung", c:"Zahlreiche Analysen über die Ethik der Simulation."},
                {t:"Soundtrack-Vinyl", i:"Kult", c:"Sammlereditionen der ikonischen Filmmusik."},
                {t:"Matrix Online", i:"MMO", c:"Ein Spiel, das die Story nach Teil 3 fortsetzte."},
                {t:"Cast-Reunion", i:"Event", c:"Reeves und Moss blieben über Jahrzehnte eng verbunden."},
                {t:"Parodien", i:"Popkultur", c:"Von Shrek bis Scary Movie wurde Matrix oft zitiert."},
                {t:"KI-Debatte", i:"Aktualität", c:"Der Film ist heute relevanter denn je (ChatGPT/KI)."},
                {t:"4K-Remaster", i:"Qualität", c:"Die Filme wurden für modernste Heimkinos optimiert."},
                {t:"Dokumentationen", i:"Hintergrund", c:"'The Matrix Revisited' zeigt die Entstehung."},
                {t:"Fantreffen", i:"Community", c:"Weltweite 'Zion-Partys' und Conventions."},
                {t:"Endlose Schleife", i:"Fazit", c:"Die Matrix wird uns immer begleiten. System Ende."}
            ]
        };

        let cur = "start", idx = 0, score = 0, quizStep = 'question';

        function update() {
            const card = data[cur][idx];
            document.getElementById('meta-cat').innerText = cur.toUpperCase();
            document.getElementById('meta-info').innerText = card.i || "Active";
            document.getElementById('card-title').innerText = card.t;
            const cont = document.getElementById('card-content');
            const nav = document.getElementById('main-nav');
            const phi = document.getElementById('phi-btn');

            if(cur === "quiz") {
                nav.style.display = "none"; phi.style.display = "none";
                if(quizStep === 'question') {
                    cont.innerHTML = `<div style="margin-bottom:15px">${card.c}</div>
                        <div class="quiz-row">
                            <button class="quiz-action-btn" onclick="check(true, event)">JA</button>
                            <button class="quiz-action-btn" onclick="check(false, event)">NEIN</button>
                        </div>`;
                }
            } else {
                nav.style.display = "flex"; phi.style.display = "block";
                cont.innerText = card.c;
            }
            document.getElementById('card-idx').innerText = `${idx + 1} / ${data[cur].length}`;
            speak();
        }

        function check(val, e) {
            if(e) e.stopPropagation();
            const correct = (val === data[cur][idx].a);
            if(correct) score++;
            
            quizStep = 'feedback';
            const cont = document.getElementById('card-content');
            const fbText = correct ? 'KORREKT.' : 'FALSCH. Bitte probiere es noch einmal.';
            cont.innerHTML = `<div style="font-size:1.8rem; font-weight:bold; color:${correct ? '#00ff41' : '#ff4444'}">${correct ? 'KORREKT' : 'FALSCH'}</div><button class="feedback-btn" onclick="nextQuizStep(event)">WEITER</button>`;
            
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(fbText); u.lang = "de-DE"; speechSynthesis.speak(u);
        }

        function nextQuizStep(e) {
            if(e) e.stopPropagation();
            if(idx + 1 < data[cur].length) { idx++; quizStep = 'question'; update(); } 
            else { showResult(); }
        }

        function showResult() {
            const perc = Math.round((score / data[cur].length) * 100);
            let rank = "Blaupillen-Level";
            if(perc > 40) rank = "Widerstandskämpfer";
            if(perc > 80) rank = "Der Auserwählte";

            const resText = `Mission beendet. Ergebnis: ${score} von ${data[cur].length} Punkten. Ihr Rang: ${rank}.`;
            const cont = document.getElementById('card-content');
            cont.innerHTML = `<div style="color:var(--matrix-yellow); font-size:1.2rem;">MISSION BEENDET</div><div style="margin:15px 0; font-size:1.4rem;">${perc}% Erfolg</div><div style="color:var(--matrix-green); font-weight:bold;">${rank}</div><button class="feedback-btn" onclick="resetToStart(event)">ZURÜCK ZUR BASIS</button>`;
            
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(resText); u.lang = "de-DE"; speechSynthesis.speak(u);
        }

        function cardClick() { if(cur !== "quiz") next(); }
        function resetToStart(e) { if(e) e.stopPropagation(); cur = "start"; idx = 0; score = 0; quizStep = 'question'; update(); }
        function setCat(c) { cur = c; idx = 0; score = 0; quizStep = 'question'; update(); }
        function next(e) { if(e) e.stopPropagation(); idx = (idx + 1) % data[cur].length; update(); }
        function prev(e) { if(e) e.stopPropagation(); idx = (idx - 1 + data[cur].length) % data[cur].length; update(); }
        
        function speak(e) { 
            if(e) e.stopPropagation();
            window.speechSynthesis.cancel();
            const card = data[cur][idx];
            const text = (card.t ? card.t + ". " : "") + card.c;
            const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; speechSynthesis.speak(u);
        }

        update();
    </script>
</body>
</html>
